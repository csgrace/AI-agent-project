[project]
name = "smart-campus-assistant-backend"
version = "0.1.0"
description = "Backend for smart campus assistant demo"
requires-python = ">=3.11"
dependencies = [
  "langchain==1.2.13",
  "langchain-core==1.2.23",
  "langchain-openai==1.1.12",
  "langchain-community==0.4.1",
  "pydantic==2.12.5",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.3",
  "todoist-api-python>=3.1.0",
  "urllib3>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sse-starlette>=2.0.0",
  "tzdata>=2024.1",
  "python-pptx>=1.0.0",
  "mistletoe>=1.5.0",
  "python-dateutil>=2.8.2",
  "pytz>=2023.3",
  "PyMuPDF>=1.23.0",
  "python-multipart>=0.0.9",
  "openai>=1.0.0",
  "faiss-cpu>=1.7.4",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
